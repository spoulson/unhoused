<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-labelledby="unhoused-logo-title">
  <title id="unhoused-logo-title">unhoused: a gopher crawling out of a hole torn in the side of a cardboard box</title>

  <!-- ground shadow -->
  <ellipse cx="100" cy="196" rx="60" ry="6" fill="#3c3836" opacity="0.12" />

  <!-- box front face (closed, taped shut on top) -->
  <rect x="25" y="60" width="150" height="125" rx="8" fill="#d5c4a1" stroke="#3c3836" stroke-width="3" />

  <!-- top-corner fold creases -->
  <line x1="25" y1="72" x2="43" y2="60" stroke="#af3a03" stroke-width="2" stroke-linecap="round" />
  <line x1="175" y1="72" x2="157" y2="60" stroke="#af3a03" stroke-width="2" stroke-linecap="round" />

  <!-- tape seam -->
  <rect x="94" y="52" width="12" height="16" fill="#fbf1c7" opacity="0.85" />

  <!-- hole torn in the box's side -->
  <rect x="52" y="98" width="96" height="78" rx="26" fill="#282828" />

  <!-- gopher ears -->
  <circle cx="72" cy="80" r="17" fill="#6ec7d6" stroke="#3c3836" stroke-width="3" />
  <circle cx="72" cy="82" r="8" fill="#fbf1c7" />
  <circle cx="128" cy="80" r="17" fill="#6ec7d6" stroke="#3c3836" stroke-width="3" />
  <circle cx="128" cy="82" r="8" fill="#fbf1c7" />

  <!-- gopher head -->
  <ellipse cx="100" cy="128" rx="39" ry="42" fill="#6ec7d6" stroke="#3c3836" stroke-width="3" />

  <!-- muzzle (large and rounded, the gopher's signature feature) -->
  <ellipse cx="100" cy="150" rx="29" ry="24" fill="#fbf1c7" stroke="#3c3836" stroke-width="2" />

  <!-- eyes: large, close-set, forward-facing -->
  <circle cx="87" cy="121" r="16" fill="#fbf1c7" stroke="#3c3836" stroke-width="2.5" />
  <circle cx="91" cy="124" r="7.5" fill="#282828" />
  <circle cx="93" cy="121" r="2" fill="#fbf1c7" />
  <circle cx="113" cy="121" r="16" fill="#fbf1c7" stroke="#3c3836" stroke-width="2.5" />
  <circle cx="109" cy="124" r="7.5" fill="#282828" />
  <circle cx="111" cy="121" r="2" fill="#fbf1c7" />

  <!-- nose -->
  <ellipse cx="100" cy="139" rx="6" ry="5" fill="#282828" />

  <!-- buck teeth -->
  <rect x="91" y="153" width="8" height="12" rx="2" fill="#fbf1c7" stroke="#3c3836" stroke-width="2" />
  <rect x="101" y="153" width="8" height="12" rx="2" fill="#fbf1c7" stroke="#3c3836" stroke-width="2" />

  <!-- paws gripping the edge of the hole -->
  <ellipse cx="63" cy="166" rx="15" ry="11" fill="#6ec7d6" stroke="#3c3836" stroke-width="3" />
  <ellipse cx="137" cy="166" rx="15" ry="11" fill="#6ec7d6" stroke="#3c3836" stroke-width="3" />
</svg>

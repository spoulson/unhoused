services:
  backend:
    image: unhoused-backend:latest
    restart: unless-stopped
    volumes:
      - ./config.yaml:/etc/unhoused/config.yaml:ro

  frontend:
    image: unhoused-frontend:latest
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - backend
      - frontend

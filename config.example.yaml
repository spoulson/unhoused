httpPublicUrl: http://localhost
listenPort: 3001
refreshIntervalSeconds: 5

profiles:
  - name: prod-usw1
    nomadUrl: http://127.0.0.1:4646
    nomadToken: "xxx"
    nodeHostnameTemplate: "{node}.foobar.local"

  - name: staging-euw1
    nomadUrl: http://127.0.0.1:4646
    nomadToken: "xxx"
    nodeHostnameTemplate: "{node}.foobar.dev"

  # Uncomment to point at `go run ./cmd/nomaddemo` (see internal/nomaddemo), which simulates a Nomad API with
  # example jobs instead of talking to a real cluster.
